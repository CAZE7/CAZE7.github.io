# --- SEO & Meta-Daten (Wichtig für Google) ---
site_name: OBD Expert Guide
site_description: Technische Dokumentation und Praxis-Anleitungen für Fahrzeug-Diagnose, Steuergeräte-Codierung und Flashen bei VAG und Mercedes-Benz.
site_author: CAZE7
site_url: https://caze7.github.io/

# --- Theme & Design Setup ---
theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - search.suggest
    - search.highlight
    - navigation.top # Zurück-nach-oben Button
    - navigation.tracking # URL ändert sich beim Scrollen für bessere Anker-Links
    - toc.integrate # Inhaltsverzeichnis in der linken Seitenleiste integrieren
    - content.code.copy # Erlaubt das einfache Kopieren von Code-Blöcken
    - content.tabs.link # Verlinkt Tabs miteinander
    - toc.follow # Hebt den aktuellen Abschnitt im Inhaltsverzeichnis hervor
    - content.tooltips # Erlaubt das Hinzufügen von Tooltips für Abkürzungen
    - navigation.sections # Erlaubt Sektionen in der Navigation
    - navigation.indexes # Erlaubt Klicks auf Sektions-Überschriften
    - navigation.expand # Klappt die Navigation automatisch auf
    - search.share # Erlaubt das Teilen von Suchergebnissen
    - search.suggest # Zeigt Suchvorschläge an
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

# --- Eigene Styles ---
extra_css:
  - stylesheets/extra.css

# --- Plugins ---
plugins:
  - search
  - tags # Erlaubt die Verwendung von Tags oben in den Dokumenten
  - git-revision-date-localized: # Zeigt "Zuletzt aktualisiert" am Ende der Seite
      enable_creation_date: true
      type: iso_date
  - glightbox: # Erlaubt das Zoomen von Bildern (extrem wichtig für Screenshots!)
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: true
      skip_classes: [nolightbox]

# --- Zusätzliche Meta-Daten für Social Media ---
extra:
  analytics: # Falls du später Google Analytics nutzen willst
    provider: google
    property: G-XXXXXXXXXX
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CAZE7
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/
    - icon: fontawesome/solid/paper-plane
      link: mailto:info@obd-expert.de

# --- Navigation ---
nav:
  - Startseite: index.md
  - Mercedes-Benz:
    - Hardware:
      - Multiplexer (SD Connect & VCI): mercedes/hardware/multiplexer.md
      - Passthrough Dongles: mercedes/hardware/dongles.md
    - Software:
      - Diagnose & Architektur: mercedes/software/architektur.md
      - DTS Monaco Guide: mercedes/software/dts_monaco.md
      - SMR-D & Flash Dateien: mercedes/software/smr_d.md
    - Codierung:
      - Praxis-Workflows & Retrofits: mercedes/codierung/anleitungen.md
  - VAG (VW, Audi, Seat, Skoda):
    - Hardware & Adapter: vag/hardware.md
    - Software & Sicherheit: vag/software.md
    - Praxis-Codierungen: vag/anleitungen.md
    - MQB Codierungen:
      - Kombiinstrument / AID: vag/kombiinstrument.md
      - Infotainment & Head-Unit: vag/infotainment.md
      - Licht-Codierung: vag/licht.md
      - Klima & Komfort: vag/klima.md
      - Sicherheit & Zentralverriegelung: vag/sicherheit.md
      - Fahrwerk & Antrieb: vag/fahrwerk.md
    - Tools:
      - FEC Generator: vag/fec.md
      - XOR Calculator: vag/xor.md
  - FAQ & Hilfe: faq.md
  - Haftungsausschluss: haftungsausschluss.md

# --- Markdown Erweiterungen (Coole Features!) ---
markdown_extensions:
  - abbr # Tooltips für Abkürzungen
  - admonition # Hinweisboxen (Info, Warnung etc.)
  - def_list # Definitionslisten
  - attr_list # CSS-Klassen direkt an Markdown-Elemente hängen
  - md_in_html # Markdown innerhalb von HTML-Tags erlauben
  - pymdownx.details # Aufklappbare Boxen (??? info "Klick mich")
  - pymdownx.superfences: # Verschachtelte Blöcke (z.B. Code in Boxen)
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: # Coole Tabs für Anleitungen (z.B. XENTRY vs. Monaco)
      alternate_style: true 
  - pymdownx.tasklist: # Checklisten
      custom_checkbox: true
  - pymdownx.highlight: # Code-Highlighting
      anchor_linenums: true
  - pymdownx.inlinehilite # Inline-Code Highlighting
  - pymdownx.snippets # Externe Dateien einbinden
  - pymdownx.mark # Text markieren mit ==Text==
  - pymdownx.keys # Tastatur-Tasten darstellen (z.B. ++ctrl+alt+del++)
  - pymdownx.emoji: # Emoji-Support
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg