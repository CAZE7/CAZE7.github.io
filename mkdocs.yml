# --- SEO & Meta-Daten (Wichtig für Google) ---
site_name: OBD Expert Guide
site_description: Technische Dokumentation und Praxis-Anleitungen für Fahrzeug-Diagnose, Steuergeräte-Codierung und Flashen bei VAG und Mercedes-Benz.
site_author: CAZE7
site_url: https://caze7.github.io/

# --- Theme & Design Setup ---
theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - search.suggest
    - search.highlight
    - navigation.top # Zurück-nach-oben Button
    - navigation.tracking # URL ändert sich beim Scrollen für bessere Anker-Links
    - toc.integrate # Inhaltsverzeichnis in der linken Seitenleiste integrieren
  palette:
    - scheme: default
      primary: white
      accent: black

# --- Eigene Styles ---
extra_css:
  - stylesheets/extra.css

# --- Plugins ---
plugins:
  - search

# --- Zusätzliche Meta-Daten für Social Media ---
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CAZE7

# --- Navigation ---
nav:
  - 🏠 Startseite: index.md
  - 🛠️ VAG (VW, Audi, Seat, Skoda):
    - Grundlagen & Tools: vag-codierung-neu.md
    - Praxis-Anleitungen: vag-anleitung.md
  - 🚘 Mercedes-Benz:
    - Grundlagen & Tools: mercedes-codierung-neu.md
    - Praxis-Anleitungen: mercedes-anleitung.md
  - ❓ FAQ & Hilfe: faq.md
  - ⚖️ Haftungsausschluss: haftungsausschluss.md