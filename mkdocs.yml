# --- SEO & Meta-Daten (Wichtig für Google) ---
site_name: OBD Expert Guide
site_description: Technische Dokumentation und Praxis-Anleitungen für Fahrzeug-Diagnose, Steuergeräte-Codierung und Flashen bei VAG und Mercedes-Benz.
site_author: CAZE7
site_url: https://caze7.github.io/

# --- Theme & Design Setup ---
theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - search.suggest
    - search.highlight
    - navigation.top # Zurück-nach-oben Button
    - navigation.tracking # URL ändert sich beim Scrollen für bessere Anker-Links
    - toc.integrate # Inhaltsverzeichnis in der linken Seitenleiste integrieren
    - content.code.copy # Erlaubt das einfache Kopieren von Code-Blöcken
    - content.tabs.link # Verlinkt Tabs miteinander
    - toc.follow # Hebt den aktuellen Abschnitt im Inhaltsverzeichnis hervor
    - content.tooltips # Erlaubt das Hinzufügen von Tooltips für Abkürzungen
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

# --- Eigene Styles ---
extra_css:
  - stylesheets/extra.css

# --- Plugins ---
plugins:
  - search

# --- Zusätzliche Meta-Daten für Social Media ---
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CAZE7

# --- Navigation ---
nav:
  - 🏠 Startseite: index.md
  - 🚘 Mercedes-Benz:
    - 🔌 Hardware & Interfaces: mercedes/hardware.md
    - 💻 Software & Architektur: mercedes/software.md
    - 🏎️ DTS Monaco Guide: mercedes/dts_monaco.md
    - 📁 SMR-D & Flash Dateien: mercedes/smr-d_quellen.md
    - 🛠️ Praxis-Codierungen: mercedes/anleitungen.md
  - 🛠️ VAG (VW, Audi, Seat, Skoda):
    - 🔌 Hardware & Adapter: vag/hardware.md
    - 💻 Software & Sicherheit: vag/software.md
    - 🛠️ Praxis-Codierungen: vag/anleitungen.md
  - ❓ FAQ & Hilfe: faq.md
  - ⚖️ Haftungsausschluss: haftungsausschluss.md

# --- Markdown Erweiterungen (Coole Features!) ---
markdown_extensions:
  - abbr # Tooltips für Abkürzungen
  - admonition # Hinweisboxen (Info, Warnung etc.)
  - def_list # Definitionslisten
  - attr_list # CSS-Klassen direkt an Markdown-Elemente hängen
  - md_in_html # Markdown innerhalb von HTML-Tags erlauben
  - pymdownx.details # Aufklappbare Boxen (??? info "Klick mich")
  - pymdownx.superfences # Verschachtelte Blöcke (z.B. Code in Boxen)
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: # Coole Tabs für Anleitungen (z.B. XENTRY vs. Monaco)
      alternate_style: true 
  - pymdownx.tasklist: # Checklisten
      custom_checkbox: true
  - pymdownx.highlight: # Code-Highlighting
      anchor_linenums: true
  - pymdownx.inlinehilite # Inline-Code Highlighting
  - pymdownx.snippets # Externe Dateien einbinden
  - pymdownx.mark # Text markieren mit ==Text==
  - pymdownx.keys # Tastatur-Tasten darstellen (z.B. ++ctrl+alt+del++)
  - pymdownx.emoji: # Emoji-Support
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg